[project]
name = "authkit"
version = "0.1.0"
description = "A small, self-hostable authentication service: Argon2id, rotating refresh tokens with reuse detection, TOTP 2FA and an audit log."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Victor Wambua" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "segno>=1.6",
    "pydantic-settings>=2.4",
    "swagger-ui-bundle>=1.1",
]

[project.scripts]
authkit = "authkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:authkit.*"]

[tool.coverage.run]
source = ["authkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
"scripts/*" = ["S101"]
"src/authkit/services/audit.py" = ["S105"]  # event names, not passwords
"src/authkit/api/schemas.py" = ["S105"]  # token_type = "Bearer"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/authkit"]
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[[tool.mypy.overrides]]
module = ["swagger_ui_bundle"]
ignore_missing_imports = true
